name: Build and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler_args: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
            binary: luajit-decompiler-v2
            asset: luajit-decompiler-v2-linux-x86_64
          - os: windows-2025
            compiler_args: -T ClangCL
            binary: luajit-decompiler-v2.exe
            asset: luajit-decompiler-v2-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.compiler_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Rename release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake -E copy "stage/bin/${{ matrix.binary }}" "stage/${{ matrix.asset }}"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: luajit-decompiler-v2-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
